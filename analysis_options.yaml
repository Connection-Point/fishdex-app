include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - lib/l10n/app_localizations*.dart # generated

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - unawaited_futures
    - prefer_final_locals

formatter:
  page_width: 140
